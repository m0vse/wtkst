name: Build and Release Installer

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2022

    env:
      CONFIGURATION: Release
      PLATFORM: x86
      VS_VERSION_RANGE: "[17.0,18.0)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: ${{ env.VS_VERSION_RANGE }}

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag '$tag' must be a numeric version like v3.2.3 or v3.2.3.4."
          }

          $parts = $version.Split('.')
          $assemblyVersion = if ($parts.Count -eq 3) { "$version.0" } else { $version }
          $installerVersion = ($assemblyVersion.Split('.')[0..2] -join '.')

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "installer_version=$installerVersion" >> $env:GITHUB_OUTPUT
          "artifact_version=$version" >> $env:GITHUB_OUTPUT

      - name: Apply tag version
        shell: pwsh
        run: |
          $assemblyVersion = "${{ steps.version.outputs.assembly_version }}"
          $installerVersion = "${{ steps.version.outputs.installer_version }}"

          $assemblyInfo = Get-Content Properties\AssemblyInfo.cs -Raw
          $assemblyInfo = $assemblyInfo -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$assemblyVersion`")"
          $assemblyInfo = $assemblyInfo -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$assemblyVersion`")"
          Set-Content Properties\AssemblyInfo.cs $assemblyInfo -NoNewline

          [xml]$project = Get-Content wtKST.csproj
          $ns = New-Object System.Xml.XmlNamespaceManager($project.NameTable)
          $ns.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $appVersionNode = $project.SelectSingleNode('//msb:ApplicationVersion', $ns)
          if ($null -eq $appVersionNode) {
            throw "Could not find ApplicationVersion in wtKST.csproj."
          }
          $appVersionNode.InnerText = $assemblyVersion
          $project.Save((Join-Path $PWD 'wtKST.csproj'))

          $setup = Get-Content Setup\Setup.vdproj -Raw
          $setup = $setup -replace '("ProductVersion" = "8:)[^"]+(")', "`${1}$installerVersion`${2}"
          $setup = $setup -replace '("ProductCode" = "8:)\{[^}]+\}(")', "`${1}{$([guid]::NewGuid().ToString().ToUpperInvariant())}`${2}"
          $setup = $setup -replace '("PackageCode" = "8:)\{[^}]+\}(")', "`${1}{$([guid]::NewGuid().ToString().ToUpperInvariant())}`${2}"
          Set-Content Setup\Setup.vdproj $setup -NoNewline

      - name: Restore NuGet packages
        shell: pwsh
        run: msbuild wtKST.sln /t:Restore /p:Configuration=${{ env.CONFIGURATION }} /p:Platform="${{ env.PLATFORM }}"

      - name: Build application
        shell: pwsh
        run: msbuild wtKST.sln /p:Configuration=${{ env.CONFIGURATION }} /p:Platform="${{ env.PLATFORM }}" /m

      - name: Run tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "Could not find vswhere.exe."
          }

          $vsInstall = & $vswhere -latest -products * -version "${{ env.VS_VERSION_RANGE }}" -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall) -or !(Test-Path $vsInstall)) {
            throw "Could not find a Visual Studio 2022 installation."
          }

          $vstest = Get-ChildItem -Path $vsInstall -Filter vstest.console.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName -First 1
          if ([string]::IsNullOrWhiteSpace($vstest) -or !(Test-Path $vstest)) {
            throw "Could not find vstest.console.exe under '$vsInstall'."
          }

          & $vstest kstTest\bin\Release\net48\kstTest.exe /Platform:x86 /Logger:"trx;LogFileName=test-results.trx"

      - name: Enable Visual Studio Installer Projects
        shell: pwsh
        run: |
          $vsixUrl = 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/VisualStudioClient/vsextensions/MicrosoftVisualStudio2022InstallerProjects/latest/vspackage'
          $vsixPath = Join-Path $env:RUNNER_TEMP 'MicrosoftVisualStudio2022InstallerProjects.vsix'
          Invoke-WebRequest -Uri $vsixUrl -OutFile $vsixPath

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "Could not find vswhere.exe."
          }

          $vsInstall = & $vswhere -latest -products * -version "${{ env.VS_VERSION_RANGE }}" -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall) -or !(Test-Path $vsInstall)) {
            throw "Could not find a Visual Studio 2022 installation."
          }

          $installer = Join-Path $vsInstall 'Common7\IDE\VSIXInstaller.exe'
          if (!(Test-Path $installer)) {
            throw "Could not find VSIXInstaller.exe under '$vsInstall'."
          }

          & $installer /quiet /admin $vsixPath
          $devenv = Join-Path $vsInstall 'Common7\IDE\devenv.com'
          if (Test-Path $devenv) {
            & $devenv /UpdateConfiguration
          }

      - name: Prepare installer project
        shell: pwsh
        run: |
          if (!(Test-Path qrv.xml)) {
            '<DocumentElement />' | Set-Content qrv.xml -NoNewline
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "Could not find vswhere.exe."
          }

          $vsInstance = & $vswhere -latest -products * -version "${{ env.VS_VERSION_RANGE }}" -format json |
            ConvertFrom-Json |
            Select-Object -First 1
          if ($null -eq $vsInstance -or [string]::IsNullOrWhiteSpace($vsInstance.instanceId)) {
            throw "Could not determine the Visual Studio 2022 instance ID."
          }

          $vsMajorVersion = ($vsInstance.installationVersion -split '\.')[0]
          $vsInstanceRoot = "$vsMajorVersion.0_$($vsInstance.instanceId)"
          $vsRoots = @(
            "HKCU:\Software\Microsoft\VisualStudio\$vsInstanceRoot",
            "HKCU:\Software\Microsoft\VisualStudio\$($vsInstanceRoot)_Config",
            "HKCU:\Software\Microsoft\VisualStudio\$vsMajorVersion.0",
            "HKCU:\Software\Microsoft\VisualStudio\$($vsMajorVersion).0_Config"
          ) | Select-Object -Unique
          foreach ($vsRoot in $vsRoots) {
            $msbuildKey = Join-Path $vsRoot 'MSBuild'
            New-Item -Path $msbuildKey -Force | Out-Null
            New-ItemProperty -Path $msbuildKey -Name DisableOutOfProcBuild -Value 1 -PropertyType DWORD -Force | Out-Null
            Get-ItemProperty -Path $msbuildKey -Name DisableOutOfProcBuild
          }

          $sourceSolutionPath = Join-Path $PWD 'wtKST.sln'
          $solutionPath = Join-Path $PWD 'InstallerBuild.sln'
          $solution = Get-Content $sourceSolutionPath -Raw
          $solution = $solution -replace '(?ms)^Project\("\{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC\}"\) = "kstTest", "kstTest\\kstTest\.csproj", "\{D4773D99-A3C2-4B9A-AD43-C2B7DE6326B9\}"\r?\nEndProject\r?\n', ''
          $solution = $solution -replace '(?m)^\s*\{D4773D99-A3C2-4B9A-AD43-C2B7DE6326B9\}\.[^\r\n]*\r?\n', ''
          if ($solution -notmatch [regex]::Escape('Setup\Setup.vdproj')) {
            $setupTypeGuid = '{54435603-DBB4-11D2-8724-00A0C9A8B90C}'
            $setupProjectGuid = '{3F19D8B5-8E05-4BC0-84B7-3D9A0A14C3D2}'
            $setupProject = "Project(`"$setupTypeGuid`") = `"wtKST Setup`", `"Setup\Setup.vdproj`", `"$setupProjectGuid`"`r`nEndProject`r`n"
            $solution = $solution -replace '(?m)^Global\r?$', ($setupProject + 'Global')

            $setupConfigs = @(
              "`t`t$($setupProjectGuid).Debug_Ubuntu|Any CPU.ActiveCfg = Debug"
              "`t`t$($setupProjectGuid).Debug_Ubuntu|x64.ActiveCfg = Debug"
              "`t`t$($setupProjectGuid).Debug_Ubuntu|x86.ActiveCfg = Debug"
              "`t`t$($setupProjectGuid).Debug|Any CPU.ActiveCfg = Debug"
              "`t`t$($setupProjectGuid).Debug|x64.ActiveCfg = Debug"
              "`t`t$($setupProjectGuid).Debug|x86.ActiveCfg = Debug"
              "`t`t$($setupProjectGuid).Release_Ubuntu|Any CPU.ActiveCfg = Release"
              "`t`t$($setupProjectGuid).Release_Ubuntu|x64.ActiveCfg = Release"
              "`t`t$($setupProjectGuid).Release_Ubuntu|x86.ActiveCfg = Release"
              "`t`t$($setupProjectGuid).Release|Any CPU.ActiveCfg = Release"
              "`t`t$($setupProjectGuid).Release|x64.ActiveCfg = Release"
              "`t`t$($setupProjectGuid).Release|x86.ActiveCfg = Release"
            ) -join "`r`n"
            $solution = $solution -replace '(?m)^(\s*EndGlobalSection\s*\r?\n\s*GlobalSection\(SolutionProperties\))', ($setupConfigs + "`r`n`$1")
            Set-Content $solutionPath $solution -NoNewline
          }
          else {
            Set-Content $solutionPath $solution -NoNewline
          }

      - name: Build MSI installer
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "Could not find vswhere.exe."
          }

          $vsInstall = & $vswhere -latest -products * -version "${{ env.VS_VERSION_RANGE }}" -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall) -or !(Test-Path $vsInstall)) {
            throw "Could not find a Visual Studio 2022 installation."
          }

          $devenv = Join-Path $vsInstall 'Common7\IDE\devenv.com'
          if (!(Test-Path $devenv)) {
            $devenv = Get-ChildItem -Path $vsInstall -Filter devenv.com -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if ([string]::IsNullOrWhiteSpace($devenv) -or !(Test-Path $devenv)) {
            throw "Could not find devenv.com under '$vsInstall'."
          }

          & $devenv InstallerBuild.sln /Build "${{ env.CONFIGURATION }}|${{ env.PLATFORM }}" /Project "wtKST Setup" /ProjectConfig "${{ env.CONFIGURATION }}"

      - name: Stage artifacts
        id: artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.artifact_version }}"
          $stage = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $msi = Get-ChildItem Setup\Release -Filter *.msi | Select-Object -First 1
          if ($null -eq $msi) {
            throw "Could not find built MSI under Setup\Release."
          }

          $msiOut = Join-Path $stage "wtKST-$version.msi"
          Copy-Item $msi.FullName $msiOut

          $zipOut = Join-Path $stage "wtKST-$version-portable.zip"
          Compress-Archive -Path bin\Release\* -DestinationPath $zipOut -Force

          "msi=$msiOut" >> $env:GITHUB_OUTPUT
          "portable_zip=$zipOut" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wtKST-${{ steps.version.outputs.artifact_version }}
          path: artifacts/*

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "${{ steps.artifacts.outputs.msi }}" `
            "${{ steps.artifacts.outputs.portable_zip }}" `
            --title "wtKST ${{ steps.version.outputs.artifact_version }}" `
            --notes "Automated release for ${{ steps.version.outputs.tag }}."
